# clusters/rancher-master/pushsecret.yaml
# Watches the cert-manager-issued secret "rajesh-tls-cert" in the
# "certificates" namespace and pushes tls.crt and tls.key into Vault KV v2
# at path: kv/tls/rajesh-tls-cert
#
# PushSecret remains at apiVersion: external-secrets.io/v1alpha1 — this has
# not changed across the ESO v2.x upgrade cycle.
#
# Prerequisites:
#   - Secret "rajesh-tls-cert" must exist in namespace "certificates"
#   - ClusterSecretStore "vault-pusher" must exist (see secretstore.yaml)
#   - cert-pusher SA must have the cert-manager-policy in Vault
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-rajesh-cert
  namespace: certificates
spec:
  refreshInterval: 10m
  secretStoreRefs:
  - name: vault-pusher
    kind: ClusterSecretStore
  selector:
    secret:
      name: rajesh-tls-cert
  data:
  - match:
      secretKey: tls.crt
      remoteRef:
        remoteKey: tls/rajesh-tls-cert
        property: tls.crt
  - match:
      secretKey: tls.key
      remoteRef:
        remoteKey: tls/rajesh-tls-cert
        property: tls.key
