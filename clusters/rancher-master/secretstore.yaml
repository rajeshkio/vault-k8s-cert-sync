# clusters/rancher-master/secretstore.yaml
# Namespaced SecretStore — used by ExternalSecret resources in the
# external-secrets namespace on rancher-master.
#
# ESO v0.17+ requires apiVersion: external-secrets.io/v1
# If you are on ESO < v0.17, change to: external-secrets.io/v1beta1
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: external-secrets
spec:
  provider:
    vault:
      server: "https://vault.rajesh-kumar.in"  # <-- change to your Vault URL
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "rancher-master"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets"
