# clusters/rke2-server/clustersecretstore.yaml
# ClusterSecretStore — cluster-scoped, usable from any namespace on rke2-server.
# Uses Kubernetes auth via the rke2-cluster-test mount path in Vault.
#
# ESO v0.17+ requires apiVersion: external-secrets.io/v1
# If you are on ESO < v0.17, change to: external-secrets.io/v1beta1
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend-access
spec:
  provider:
    vault:
      server: "https://vault.rajesh-kumar.in"  # <-- change to your Vault URL
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "rke2-cluster-test"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
